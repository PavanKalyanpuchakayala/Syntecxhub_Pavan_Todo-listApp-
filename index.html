<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List App</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">

        <h1>📝 To-Do List</h1>

        <div class="input-container">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button onclick="addTask()">
                ➕ Add
            </button>

        </div>

        <ul id="taskList"></ul>

        <div class="bottom">

            <p id="taskCount">
                0 Tasks
            </p>

            <button
                class="clear-btn"
                onclick="clearAll()"
            >
                🗑️ Clear All
            </button>

        </div>

    </div>

    <script src="index.js"></script>

</body>

</html>
